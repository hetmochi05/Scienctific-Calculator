<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Smart Calculator | Basic, Scientific, Age & Currency Calculator</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Smart Calculator - Basic, Scientific, Age & Currency Calculator">
    <meta name="description"
        content="Smart Calculator is an all-in-one calculation tool featuring Basic Calculator, Scientific Calculator, Age Calculator, and Currency Converter with live exchange rates.">
    <meta name="keywords"
        content="calculator, smart calculator, online calculator, scientific calculator, age calculator, currency converter, math calculator, free calculator">
    <meta name="author" content="Het Mochi">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon/favicon.png">

    <!-- Mobile Web App Capability -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#181a20">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/colors.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/tools.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="window">

        <!-- ================= CALCULATOR SCREEN ================= -->

        <div id="calcScreen" class="screen active">

            <header class="title-bar">

                <div class="title-left">
                    <i class="fa-solid fa-calculator app-icon"></i>
                    <span class="app-title">Calculator</span>
                    <!-- Standard / Scientific Mode Switcher Pill -->
                    <button type="button" id="headerModeToggle" class="mode-pill-btn" aria-label="Toggle mode"
                        title="Switch between Standard and Scientific Mode">
                        <span class="mode-text mode-text-full">Scientific</span>
                        <span class="mode-text-short">Sci</span>
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                </div>

                <div class="title-right">
                    <button type="button" id="toggleSoundBtn" aria-label="Toggle sound" title="Sound: On">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <button type="button" id="openHistoryDrawerBtn" class="mobile-history-toggle"
                        aria-label="Toggle history drawer" title="Calculation History">
                        <i class="fa-regular fa-clock"></i>
                    </button>
                    <button type="button" id="openCurrencyScreen" aria-label="Currency converter"
                        title="Currency Converter">
                        <i class="fa-solid fa-money-bill-transfer"></i>
                    </button>
                    <button type="button" id="openAgeScreen" aria-label="Age calculator" title="Age Calculator">
                        <i class="fa-solid fa-cake-candles"></i>
                    </button>
                </div>

            </header>

            <!-- ================= Main ================= -->

            <main class="calculator">

                <!-- ================= History ================= -->

                <section class="history">

                    <div class="history-header">
                        <div class="history-tabs">
                            <button type="button" class="active">
                                <i class="fa-regular fa-clock"></i>
                                History
                            </button>
                        </div>
                        <button type="button" class="history-close-btn" aria-label="Close history drawer"
                            onclick="closeHistoryDrawer()">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="history-subhead">
                        <h3>Recent Calculations</h3>
                    </div>

                    <div class="history-list">
                        <!-- populated dynamically by display.js -->
                    </div>

                    <button type="button" class="clear-history">
                        <i class="fa-regular fa-trash-can"></i>
                        Clear History
                    </button>

                </section>

                <!-- ================= Right Side ================= -->

                <section class="right-panel">

                    <!-- Display -->

                    <section class="display">

                        <div class="display-status-bar">
                            <div class="status-badges">
                                <span id="angleBadge" class="status-badge" title="Angle mode: DEG or RAD">DEG</span>
                                <span id="memoryBadge" class="status-badge" title="Memory value stored">M</span>
                                <span id="secondBadge" class="status-badge" title="2nd function active">2nd</span>
                            </div>
                            <button type="button" id="copyResultBtn" class="copy-btn" aria-label="Copy result"
                                title="Copy result to clipboard">
                                <i class="fa-regular fa-copy"></i>
                                <span>Copy</span>
                            </button>
                        </div>

                        <div class="expression"></div>

                        <div class="result" id="result">0</div>

                    </section>

                    <!-- Mobile Scientific Sub-Tabs (portrait phone only) -->
                    <div class="mobile-sci-tabs" role="tablist" aria-label="Mobile Keypad Views">
                        <button type="button" class="mobile-sci-tab active" data-tab="all" role="tab"
                            aria-selected="true">
                            <span>All (10-Col)</span>
                        </button>
                        <button type="button" class="mobile-sci-tab" data-tab="basic" role="tab" aria-selected="false">
                            <span>123 Number Pad</span>
                        </button>
                        <button type="button" class="mobile-sci-tab" data-tab="sci" role="tab" aria-selected="false">
                            <span>fx Scientific</span>
                        </button>
                    </div>

                    <!-- Buttons -->

                    <section class="buttons">

                        <!-- Row 1 -->

                        <button type="button" class="sci-only">(</button>
                        <button type="button" class="sci-only">)</button>
                        <button type="button" class="sci-only">mc</button>
                        <button type="button" class="sci-only">m+</button>
                        <button type="button" class="sci-only">m−</button>
                        <button type="button" class="sci-only">mr</button>
                        <button type="button" class="ac-btn">AC</button>
                        <button type="button" class="backspace-btn" aria-label="Backspace">
                            <i class="fa-solid fa-delete-left"></i>
                        </button>
                        <button type="button">+/-</button>
                        <button type="button" class="operator">÷</button>

                        <!-- Row 2 -->

                        <button type="button" class="sci-only">2nd</button>
                        <button type="button" class="sci-only">x²</button>
                        <button type="button" class="sci-only">x³</button>
                        <button type="button" class="sci-only">xʸ</button>
                        <button type="button" class="sci-only">eˣ</button>
                        <button type="button" class="sci-only">10ˣ</button>
                        <button type="button">7</button>
                        <button type="button">8</button>
                        <button type="button">9</button>
                        <button type="button" class="operator">×</button>

                        <!-- Row 3 -->

                        <button type="button" class="sci-only">1/x</button>
                        <button type="button" class="sci-only">²√x</button>
                        <button type="button" class="sci-only">³√x</button>
                        <button type="button" class="sci-only">ʸ√x</button>
                        <button type="button" class="sci-only">ln</button>
                        <button type="button" class="sci-only">log</button>
                        <button type="button">4</button>
                        <button type="button">5</button>
                        <button type="button">6</button>
                        <button type="button" class="operator">−</button>

                        <!-- Row 4 -->

                        <button type="button" class="sci-only">x!</button>
                        <button type="button" class="sci-only">sin</button>
                        <button type="button" class="sci-only">cos</button>
                        <button type="button" class="sci-only">tan</button>
                        <button type="button" class="sci-only">e</button>
                        <button type="button" class="sci-only">EE</button>
                        <button type="button">1</button>
                        <button type="button">2</button>
                        <button type="button">3</button>
                        <button type="button" class="operator">+</button>

                        <!-- Row 5 -->

                        <button type="button" id="inlineModeToggle" class="sci-only"
                            aria-label="Switch to Standard mode" title="Switch between Standard and Scientific mode">
                            <i class="fa-solid fa-calculator"></i>
                        </button>

                        <button type="button" class="sci-only">sinh</button>
                        <button type="button" class="sci-only">cosh</button>
                        <button type="button" class="sci-only">tanh</button>
                        <button type="button" class="sci-only">π</button>
                        <button type="button" class="sci-only">Rad</button>
                        <button type="button">%</button>
                        <button type="button">0</button>
                        <button type="button">.</button>
                        <button type="button" class="operator">=</button>

                    </section>

                </section>

            </main>

        </div>

        <!-- ================= AGE CALCULATOR SCREEN ================= -->

        <div id="ageScreen" class="screen tool-screen">

            <header class="title-bar">
                <div class="title-left">
                    <i class="fa-solid fa-cake-candles app-icon"></i>
                    <span>Age Calculator</span>
                </div>
                <div class="title-right">
                    <button type="button" data-back aria-label="Back to calculator" title="Back to Calculator">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </header>

            <main class="tool-content">
                <div class="tool-card">

                    <label class="tool-label" for="ageBirthDate">Date of birth</label>
                    <input type="date" id="ageBirthDate" class="tool-input">

                    <label class="tool-label" for="ageAsOfDate">Calculate age as of</label>
                    <input type="date" id="ageAsOfDate" class="tool-input">

                    <button type="button" id="ageCalculateBtn" class="tool-primary-btn">Calculate Age</button>

                    <div id="ageError" class="tool-error" hidden></div>

                    <div id="ageResult" class="tool-result" hidden>
                        <div class="tool-result-main">
                            <span id="ageYears">0</span> years
                            <span id="ageMonths">0</span> months
                            <span id="ageDays">0</span> days
                        </div>

                        <div class="age-meta-row">
                            <div id="ageNextBday" class="age-meta-item"></div>
                            <div id="ageZodiac" class="age-meta-badge"></div>
                        </div>

                        <div class="age-breakdown">
                            <div>or <span id="ageTotalMonths">0</span> months <span id="ageTotalMonthsDays">0</span>
                                days</div>
                            <div>or <span id="ageTotalWeeks">0</span> weeks <span id="ageTotalWeeksDays">0</span> days
                            </div>
                            <div>or <span id="ageTotalDays">0</span> days</div>
                            <div>or <span id="ageTotalHours">0</span> hours</div>
                            <div>or <span id="ageTotalMinutes">0</span> minutes</div>
                            <div>or <span id="ageTotalSeconds">0</span> seconds</div>
                        </div>
                    </div>

                </div>
            </main>

        </div>

        <!-- ================= CURRENCY CALCULATOR SCREEN ================= -->

        <div id="currencyScreen" class="screen tool-screen">

            <header class="title-bar">
                <div class="title-left">
                    <i class="fa-solid fa-money-bill-transfer app-icon"></i>
                    <span>Currency Calculator</span>
                </div>
                <div class="title-right">
                    <button type="button" data-back aria-label="Back to calculator" title="Back to Calculator">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </header>

            <main class="tool-content">
                <div class="tool-card">

                    <label class="tool-label" for="currencyAmount">Amount</label>
                    <input type="number" id="currencyAmount" class="tool-input" value="1" min="0" step="any"
                        placeholder="Enter amount" inputmode="decimal" autocomplete="off">

                    <div class="currency-chips">
                        <span class="chips-label">Popular:</span>
                        <button type="button" class="currency-chip" data-currency-quick="USD">USD</button>
                        <button type="button" class="currency-chip" data-currency-quick="EUR">EUR</button>
                        <button type="button" class="currency-chip" data-currency-quick="GBP">GBP</button>
                        <button type="button" class="currency-chip" data-currency-quick="INR">INR</button>
                        <button type="button" class="currency-chip" data-currency-quick="JPY">JPY</button>
                        <button type="button" class="currency-chip" data-currency-quick="CAD">CAD</button>
                        <button type="button" class="currency-chip" data-currency-quick="AUD">AUD</button>
                    </div>

                    <div class="currency-row">
                        <div class="currency-field">
                            <label class="tool-label" for="currencyFrom">From</label>
                            <select id="currencyFrom" class="tool-select"></select>
                        </div>

                        <button type="button" id="currencySwapBtn" class="currency-swap-btn"
                            aria-label="Swap currencies" title="Swap currencies">
                            <i class="fa-solid fa-arrow-right-arrow-left"></i>
                        </button>

                        <div class="currency-field">
                            <label class="tool-label" for="currencyTo">To</label>
                            <select id="currencyTo" class="tool-select"></select>
                        </div>
                    </div>

                    <button type="button" id="currencyConvertBtn" class="tool-primary-btn">Convert</button>

                    <div id="currencyLoading" class="tool-loading" hidden>
                        <i class="fa-solid fa-spinner fa-spin"></i> Fetching latest rates…
                    </div>
                    <div id="currencyError" class="tool-error" hidden></div>

                    <div id="currencyResult" class="tool-result" hidden>
                        <div class="tool-result-main" id="currencyResultMain"></div>
                        <div class="tool-result-sub" id="currencyResultSub"></div>
                    </div>

                </div>
            </main>

        </div>

    </div>

    <script src="assets/js/calculator-engine.js"></script>
    <script src="assets/js/display.js"></script>
    <script src="assets/js/ui-controls.js"></script>
    <script src="assets/js/keyboard.js"></script>
    <script src="assets/js/tools.js"></script>
    <script src="assets/js/app.js"></script>

</body>

</html>
